const main = document.getElementById('main');

posts.forEach((p, i) => {
  const card = document.createElement('div');
  card.className = 'post-card';
  const isDump = p.formato === 'Dump';

  card.innerHTML = `
    <div class="post-header" onclick="toggle(${i})">
      <span class="post-num">${p.num}</span>
      
      
      <span class="post-title">${p.title}</span>
      <span class="pill ${p.tag}">${p.formato}</span>
      <span class="toggle-btn" id="btn-${i}">↓</span>
    </div>
    <div class="post-body" id="body-${i}">
      <div class="sections-grid">
        <div class="section-block">
          <div class="section-label">Objetivo</div>
          <div class="section-text">${p.objetivo}</div>
        </div>
        <div class="section-block">
          <div class="section-label">${isDump ? 'Fotos para capturar' : 'Cenas para gravar'}</div>
          <div class="section-text">${p.cenas}</div>
        </div>
        ${isDump && p.dump ? `
        <div class="section-block full">
          <div class="section-label">Orientação de estilo dump</div>
          <div class="dump-block">${p.dump}</div>
        </div>` : ''}
        <div class="section-block full">
          <div class="section-label">${isDump ? 'Frase sobreposta + stories de apoio' : 'Roteiro completo'}</div>
          <div class="script-block">${p.roteiro}</div>
        </div>
        <div class="section-block full">
          <div class="section-label">Legenda pronta</div>
          <div class="legenda-block">${p.legenda}</div>
        </div>
      </div>
    </div>
  `;
  main.appendChild(card);
});

function toggle(i) {
  const body = document.getElementById('body-' + i);
  const btn = document.getElementById('btn-' + i);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  btn.textContent = isOpen ? '↓' : '↑';
}
</script>
</body>
</html>
